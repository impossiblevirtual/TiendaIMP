<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760" role="img" aria-labelledby="title desc"><title id="title">Exemplo de calendário de conteúdo</title><desc id="desc">Prévia ilustrativa de sete temas de publicações dentro de um calendário personalizado de 30 dias.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10213b"/><stop offset="1" stop-color="#1758ba"/></linearGradient></defs><rect width="1080" height="760" rx="36" fill="#f3f6fb"/><rect x="28" y="28" width="1024" height="704" rx="28" fill="white" stroke="#dbe4f0" stroke-width="2"/><rect x="28" y="28" width="1024" height="210" rx="28" fill="url(#bg)"/><rect x="28" y="190" width="1024" height="48" fill="url(#bg)"/><text x="76" y="83" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#cbdcff">SEPCE STUDIO · PLANEJAMENTO</text><text x="76" y="142" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#ffffff">Uma semana, com ideias claras</text><text x="76" y="190" font-family="Arial,sans-serif" font-size="23" fill="#e6efff">Sete temas úteis dentro de um calendário de 30 dias</text><g font-family="Arial,sans-serif"><g><rect x="60" y="270" width="300" height="118" rx="18" fill="#f7f9fd" stroke="#dbe4f0" stroke-width="2"/><circle cx="95" cy="307" r="18" fill="#1758ba"/><text x="95" y="314" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">1</text><text x="126" y="312" font-size="23" font-weight="700" fill="#17243b">Compartilhe uma dica</text><text x="88" y="352" font-size="18" fill="#516078">Algo prático para salvar</text></g><g><rect x="390" y="270" width="300" height="118" rx="18" fill="#f7f9fd" stroke="#dbe4f0" stroke-width="2"/><circle cx="425" cy="307" r="18" fill="#f08b72"/><text x="425" y="314" text-anchor="middle" font-size="17" font-weight="700" fill="#17243b">2</text><text x="456" y="312" font-size="23" font-weight="700" fill="#17243b">Mostre sua oferta</text><text x="418" y="352" font-size="18" fill="#516078">Explique por que é útil</text></g><g><rect x="720" y="270" width="300" height="118" rx="18" fill="#f7f9fd" stroke="#dbe4f0" stroke-width="2"/><circle cx="755" cy="307" r="18" fill="#1758ba"/><text x="755" y="314" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">3</text><text x="786" y="312" font-size="23" font-weight="700" fill="#17243b">Bastidores</text><text x="748" y="352" font-size="18" fill="#516078">Mostre o processo real</text></g><g><rect x="60" y="410" width="300" height="118" rx="18" fill="#f7f9fd" stroke="#dbe4f0" stroke-width="2"/><circle cx="95" cy="447" r="18" fill="#f08b72"/><text x="95" y="454" text-anchor="middle" font-size="17" font-weight="700" fill="#17243b">4</text><text x="126" y="452" font-size="23" font-weight="700" fill="#17243b">Responda uma dúvida</text><text x="88" y="492" font-size="18" fill="#516078">Deixe a compra mais clara</text></g><g><rect x="390" y="410" width="300" height="118" rx="18" fill="#f7f9fd" stroke="#dbe4f0" stroke-width="2"/><circle cx="425" cy="447" r="18" fill="#1758ba"/><text x="425" y="454" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">5</text><text x="456" y="452" font-size="23" font-weight="700" fill="#17243b">Comece uma conversa</text><text x="418" y="492" font-size="18" fill="#516078">Faça uma pergunta simples</text></g><g><rect x="720" y="410" width="300" height="118" rx="18" fill="#f7f9fd" stroke="#dbe4f0" stroke-width="2"/><circle cx="755" cy="447" r="18" fill="#f08b72"/><text x="755" y="454" text-anchor="middle" font-size="17" font-weight="700" fill="#17243b">6</text><text x="786" y="452" font-size="23" font-weight="700" fill="#17243b">Dê uma dica útil</text><text x="748" y="492" font-size="18" fill="#516078">Ajude antes de vender</text></g></g><rect x="60" y="558" width="960" height="118" rx="18" fill="#edf4ff"/><text x="88" y="600" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1758ba">Seu negócio, sua voz</text><text x="88" y="638" font-family="Arial,sans-serif" font-size="20" fill="#34445e">Prévia ilustrativa · o plano final é adaptado ao seu negócio.</text><rect x="840" y="585" width="150" height="48" rx="24" fill="#1758ba"/><text x="915" y="615" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">30 DIAS</text></svg>